<!doctype html>

<html lang='pt-br'>
    <head>
        <meta charset='utf-8' />
        <title>Gefina - Faturas</title>
    </head>
    <body>
        <h1>Faturas</h1>

        <div></div>

        <script
            crossorigin
            src='https://unpkg.com/react@18/umd/react.development.js'
        ></script>
        <script
            crossorigin
            src='https://unpkg.com/react-dom@18/umd/react-dom.development.js'
        ></script>
        <script
            crossorigin
            src='https://unpkg.com/@babel/standalone/babel.min.js'
        ></script>

        <script type='text/babel'>
            
            const invoices = [
                {
                    id: 1,
                    amount: 125000,
                    status: 'pending',
                    issueDate: '2026-06-01',
                    dueDate: '2026-06-15',
                    customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
                },
                {
                    id: 2,
                    amount: 348000,
                    status: 'paid',
                    issueDate: '2026-05-12',
                    dueDate: '2026-06-11',
                    customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
                },
                {
                    id: 3,
                    amount: 96500,
                    status: 'pending',
                    issueDate: '2026-06-20',
                    dueDate: '2026-07-20',
                    customer: { id: 2, name: 'Gráfica Aurora', email: 'contato@graficaaurora.com.br' },
                }
            ];

            const root = document.querySelector('div');
            
            function statusLabel(status) {
                return status === 'paid' ? 'Pago' : 'Pendente';
            }

            function InvoiceRow(props) {
                const invoice = props.invoice;

                return (
                    <tr>
                        <td>{invoice.customer.name}</td>
                        <td>{invoice.amount}</td>
                        <td>{invoice.issueDate}</td>
                        <td>{invoice.dueDate}</td>
                        <td>{statusLabel(invoice.status)}</td>
                    </tr>
                );
            }

            function InvoiceTable(props) {
                return (
                    <table>
                        <thead>
                            <tr>
                                <th>Cliente</th>
                                <th>Valor</th>
                                <th>Emissão</th>
                                <th>Vencimento</th>
                                <th>Situação</th>
                            </tr>
                        </thead>
                        <tbody>
                            {props.invoices.map(function (invoice) {
                                return <InvoiceRow
                                    key={invoice.id}
                                    invoice={invoice}
                                />;
                            })}
                        </tbody>
                    </table>
                );
            }

            function App() {
                return <InvoiceTable invoices={invoices} />
            }

            ReactDOM.createRoot(root).render(<App/>);
        </script>
    </body>
</html>

<!doctype html>

<html lang='pt-br'>
    <head>
        <meta charset='utf-8' />
        <title>Gefina - Faturas</title>
    </head>
    <body>
        <h1>Faturas</h1>

        <table>
            <thead>
                <tr>
                    <td>Cliente</td>
                    <td>Valor</td>
                    <td>Emissão</td>
                    <td>Vencimento</td>
                    <td>Situação</td>
                </tr>
            </thead>
            <tbody>
                
            </tbody>
        </table>

        <script>
            
            const invoices = [
                {
                    id: 1,
                    amount: 125000,
                    status: 'pending',
                    issueDate: '2026-06-01',
                    dueDate: '2026-06-15',
                    customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
                },
                {
                    id: 2,
                    amount: 348000,
                    status: 'paid',
                    issueDate: '2026-05-12',
                    dueDate: '2026-06-11',
                    customer: { id: 1, name: 'Construtora Meridiano', email: 'contato@meridiano.com.br' },
                },
                {
                    id: 3,
                    amount: 96500,
                    status: 'pending',
                    issueDate: '2026-06-20',
                    dueDate: '2026-07-20',
                    customer: { id: 2, name: 'Gráfica Aurora', email: 'contato@graficaaurora.com.br' },
                }
            ];

            const tableBody = document.querySelector('tbody');

            function statusLabel(status) {
                if (status !== 'paid') return 'Pendente';

                return 'Pago';
            }

            function addCell(row, value) {
                const cell = document.createElement('td');
                cell.textContent = value;
                row.appendChild(cell);
            }
            
            for (let i = 0; i < invoices.length; i++) {
                const invoice = invoices[i];
                const row = document.createElement('tr');

                addCell(row, invoice.customer.name);
                addCell(row, invoice.amount);
                addCell(row, invoice.issueDate);
                addCell(row, invoice.dueDate);
                addCell(row, statusLabel(invoice.status));
                
                tableBody.appendChild(row);
            }
        </script>
    </body>
</html>
